; ==========================================================
; Polybar Color Theme: default
; Nord-inspired palette with semi-transparent background
; ==========================================================

[colors]
; 60% opacity background (#992E3440) for blurred see-through backdrop via picom
background = #992E3440
background-alt = #CC3B4252
foreground = #ECEFF4
foreground-alt = #D8DEE9
primary = #88C0D0
secondary = #81A1C1
accent = #B48EAD
success = #A3BE8C
warning = #EBCB8B
alert = #BF616A
disabled = #4C566A
