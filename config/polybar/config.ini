;==========================================================
;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;   Tri-Pill Layout (Apps Dock, Main Status Bar, System HUD)
;==========================================================

include-file = current_theme.ini

;----------------------------------------------------------
; BAR: APPS DOCK (Left Flank: 20% width, centered over Left column)
;----------------------------------------------------------
[bar/apps]
width = 20%
offset-x = 2.5%
height = 24pt
radius = 12

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 6pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

modules-center = apps_dock
cursor-click = pointer

enable-ipc = true
wm-restack = i3
override-redirect = true

;----------------------------------------------------------
; BAR: MAIN BAR (Center Master: 50% width, centered over Center column)
;----------------------------------------------------------
[bar/main]
width = 50%
offset-x = 25%
height = 24pt
radius = 12

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 6pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

modules-left = xworkspaces xwindow
modules-right = mpris wallpaper antivirus pulseaudio date
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3
override-redirect = true

;----------------------------------------------------------
; BAR: SYSTEM HUD (Right Flank: 20% width, centered over Right column)
; Takes: bluetooth, wifi, diskspace, ram, cpu
;----------------------------------------------------------
[bar/right]
width = 20%
offset-x = 77.5%
height = 24pt
radius = 12

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 6pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

modules-center = bluetooth wifi filesystem memory cpu
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3
override-redirect = true

;----------------------------------------------------------
; WORKSPACES & WINDOW
;----------------------------------------------------------
[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

;----------------------------------------------------------
; SYSTEM MODULES (Right Bar)
;----------------------------------------------------------
[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%
label-mounted-foreground = ${colors.foreground}

label-unmounted = %mountpoint% n/a
label-unmounted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
label-foreground = ${colors.foreground}

[module/wifi]
type = internal/network
interface = wlp7s0
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.disabled}
label-disconnected = "off"
label-disconnected-foreground = ${colors.disabled}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 5
format = <label>
format-foreground = ${colors.primary}
click-left = blueman-manager &
click-right = bluetoothctl power toggle &

;----------------------------------------------------------
; MEDIA & STATUS MODULES (Center Main Bar)
;----------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

label-muted = "󰝟 muted"
label-muted-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

[module/mpris]
type = custom/script
exec = ~/.config/polybar/player.sh
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label-foreground = ${colors.foreground}
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous

[module/wallpaper]
type = custom/script
exec = echo ""
click-left = python3 ~/.local/bin/wallpaper_rotator.py &
format-foreground = ${colors.primary}

[module/antivirus]
type = custom/script
exec = ~/.config/polybar/antivirus.py
interval = 30
click-left = ~/.config/polybar/antivirus.py --notify &
click-right = ~/.config/polybar/antivirus.py --refresh &
format-foreground = ${colors.foreground}

[module/torrent]
type = custom/script
exec = ~/.config/polybar/torrent.sh
interval = 5
format-foreground = ${colors.primary}
click-left = alacritty -e tremc -X &

;----------------------------------------------------------
; APPS DOCK MODULE (Left Bar)
;----------------------------------------------------------
[module/apps_dock]
type = custom/script
exec = python3 ~/.config/polybar/apps_dock.py
interval = 1
format = <label>
format-foreground = ${colors.foreground}
click-right = python3 ~/.config/polybar/apps_settings.py &

[settings]
screenchange-reload = true
pseudo-transparency = true
