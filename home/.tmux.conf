# General behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,tmux-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on

# Sensible navigation and reload key bindings
setw -g mode-keys vi
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane borders
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0"
set -g display-panes-colour "#81a1c1"
set -g display-panes-active-colour "#ebcb8b"
set -g message-style "fg=#2e3440,bg=#88c0d0,bold"
set -g message-command-style "fg=#2e3440,bg=#8fbcbb,bold"

# Classic Powerline status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#3b4252]"
set -g status-right "#[fg=#3b4252,bg=#2e3440]#[fg=#eceff4,bg=#3b4252] %Y-%m-%d #[fg=#4c566a,bg=#3b4252]#[fg=#2e3440,bg=#88c0d0,bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#d8dee9,bg=#2e3440] #I:#W "
setw -g window-status-current-format "#[fg=#2e3440,bg=#a3be8c,bold] #I:#W #[fg=#a3be8c,bg=#2e3440]"
setw -g window-status-activity-style "fg=#ebcb8b,bg=#2e3440,bold"
setw -g window-status-bell-style "fg=#bf616a,bg=#2e3440,bold"

# Copy mode is readable against the dark background
setw -g mode-style "fg=#2e3440,bg=#ebcb8b"
